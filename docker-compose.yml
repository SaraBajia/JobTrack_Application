services:
  mysql:
    image: mysql:8.0
    container_name: jobtrack-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jobtrack
    ports:
      - "3306:3306"
    volumes:
      - jobtrack_mysql_data:/var/lib/mysql
volumes:
  jobtrack_mysql_data:
